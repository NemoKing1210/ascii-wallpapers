<!DOCTYPE html>
<!-- SPDX-License-Identifier: MIT -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#04060c">
<meta name="description" content="Animated ASCII-art cosmos: a ringed gas giant, an icy planet with a moon, nebula dust, twinkling stars and an occasional shooting star.">
<title>ASCII Cosmos</title>
<style>
  html,
  body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #04060c;
    color: #d6e2ff;
    cursor: none;
  }

  #scene {
    display: block;
    width: 100vw;
    height: 100vh;
  }

  .vignette,
  .scanlines {
    position: fixed;
    inset: 0;
    pointer-events: none;
  }

  .vignette {
    background: radial-gradient(
      ellipse at 50% 44%,
      rgba(0, 0, 0, 0) 42%,
      rgba(0, 0, 0, 0.32) 78%,
      rgba(0, 0, 0, 0.62) 100%
    );
  }

  .scanlines {
    opacity: 0.35;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255, 255, 255, 0.03) 0px,
      rgba(255, 255, 255, 0.03) 1px,
      rgba(0, 0, 0, 0) 1px,
      rgba(0, 0, 0, 0) 3px
    );
  }

  noscript {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    font: 16px/1.5 monospace;
    text-align: center;
    padding: 2rem;
  }
</style>
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>
<div class="vignette" aria-hidden="true"></div>
<div class="scanlines" aria-hidden="true"></div>
<noscript>This wallpaper needs JavaScript to render.</noscript>
<script src="main.js"></script>
</body>
</html>
